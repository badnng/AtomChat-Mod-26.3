name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在且版本号匹配的 v* 标签
        required: true
        type: string
      target:
        description: 商店发布目标（all 或 versions/targets.json 中的可发布目标）
        default: all
        type: string
      dry_run:
        description: 只构建并校验，不创建 Release 或发布到商店
        default: true
        type: boolean
      publish_stores_only:
        description: 仅从已发布 Release 下载原附件并重试商店发布（需关闭 dry_run）
        default: false
        type: boolean

permissions:
  contents: read

# A tag's draft and its store uploads cannot race another attempt for that tag.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  targets:
    name: 校验标签与发布矩阵
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      list: ${{ steps.matrix.outputs.list }}
      publish_list: ${{ steps.matrix.outputs.publish_list }}
      commit: ${{ steps.matrix.outputs.commit }}
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: 校验版本、标签与离线脚本
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          python3 -B .github/scripts/release_ci.py validate-tag --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -B tools/test_verify_jars.py
          python3 -B tools/verify_targets.py --matrix-out "$RUNNER_TEMP/matrix.json"
      - name: 导出可发布目标与提交号
        id: matrix
        env:
          SELECTED_TARGET: ${{ inputs.target || 'all' }}
          STORES_ONLY: ${{ inputs.publish_stores_only == true }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, subprocess
          if os.environ['STORES_ONLY'] == 'true' and os.environ['DRY_RUN'] == 'true':
              raise SystemExit('publish_stores_only requires dry_run=false')
          matrix = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'matrix.json').read_text())
          matrix = [item for item in matrix if item['buildable']]
          selected = os.environ['SELECTED_TARGET']
          publish = [item for item in matrix if selected == 'all' or item['target'] == selected]
          if not matrix or not publish:
              raise SystemExit('No matching buildable target in versions/targets.json')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('list=' + json.dumps(matrix) + '\n')
              output.write('publish_list=' + json.dumps(publish) + '\n')
              output.write('commit=' + commit + '\n')
          PY

  build:
    name: 构建 ${{ matrix.target }}
    needs: targets
    if: inputs.publish_stores_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.list) }}
    env:
      ATOMCHAT_BUILD_SHA: ${{ needs.targets.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.targets.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/build-mod
        with:
          target: ${{ matrix.target }}
          project: ${{ matrix.project }}
          java: ${{ matrix.java }}
          artifact-name: jar-${{ matrix.target }}
          cache-read-only: 'true'

  package:
    name: 汇总并复核完整发布包
    needs: [targets, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ATOMCHAT_BUILD_SHA: ${{ needs.targets.outputs.commit }}
      RELEASE_TAG: ${{ needs.targets.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.targets.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jar-*
          path: ${{ runner.temp }}/artifacts
      - name: 校验所有目标、构建戳、SHA-256 与发布说明
        run: |
          python3 -B .github/scripts/release_ci.py prepare --tag "$RELEASE_TAG" \
            --artifacts-dir "$RUNNER_TEMP/artifacts" --output "$RUNNER_TEMP/release-package/files" \
            --notes "$RUNNER_TEMP/release-package/release-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: 完整上传草稿附件后发布
    needs: [targets, package]
    if: github.repository == 'badnng/AtomChat-Mod-26.3' && inputs.dry_run != true
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.targets.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-package
      - name: 发布（已发布标签拒绝覆盖）
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.targets.outputs.tag }}
          PRERELEASE: ${{ needs.targets.outputs.prerelease }}
          ATOMCHAT_BUILD_SHA: ${{ needs.targets.outputs.commit }}
        run: |
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          python3 -B .github/scripts/publish_github.py --tag "$RELEASE_TAG" \
            --directory "$RUNNER_TEMP/release-package/files" \
            --notes "$RUNNER_TEMP/release-package/release-notes.md" "${args[@]}"

  publish:
    name: 发布原始附件到商店 ${{ matrix.target }}
    needs: [targets, release]
    if: >-
      always() && !cancelled() && needs.targets.result == 'success' &&
      github.repository == 'badnng/AtomChat-Mod-26.3' &&
      inputs.dry_run != true && needs.targets.outputs.prerelease == 'false' &&
      (needs.release.result == 'success' || inputs.publish_stores_only == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.publish_list) }}
    env:
      ATOMCHAT_BUILD_SHA: ${{ needs.targets.outputs.commit }}
      RELEASE_TAG: ${{ needs.targets.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.targets.outputs.commit }}
          persist-credentials: false
      - name: 下载已发布 Release 的同一份目标附件
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = false
          mkdir -p "$RUNNER_TEMP/store-artifacts/$TARGET"
          gh release download "$RELEASE_TAG" --pattern '*.jar' \
            --pattern "build-info-$TARGET.json" --pattern "SHA256SUMS-$TARGET" \
            --dir "$RUNNER_TEMP/store-download"
          TARGET="$TARGET" python3 -B - <<'PY'
          import json, os, pathlib, shutil
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          target = os.environ['TARGET']
          source, dest = base / 'store-download', base / 'store-artifacts' / target
          info = json.loads((source / f'build-info-{target}.json').read_text(encoding='utf-8'))
          for item in info['artifacts']:
              name = item['fileName']
              if pathlib.PurePosixPath(name).name != name or '\\' in name:
                  raise SystemExit('Unsafe release artifact filename')
              shutil.copyfile(source / name, dest / name)
          shutil.copyfile(source / f'build-info-{target}.json', dest / 'build-info.json')
          shutil.copyfile(source / f'SHA256SUMS-{target}', dest / 'SHA256SUMS')
          PY
      - name: 复核下载附件，固定两种操作系统的输入
        id: verified
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 -B .github/scripts/release_ci.py verify-target \
            --artifacts-dir "$RUNNER_TEMP/store-artifacts" --target "$TARGET" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: 将 Gradle 缓存放到工作区外
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: 发布已校验附件（不重新构建）
        working-directory: ${{ matrix.project }}
        env:
          WINDOWS_JAR: ${{ steps.verified.outputs.windows_jar }}
          LINUX_JAR: ${{ steps.verified.outputs.linux_jar }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          bash ./gradlew publishMods --no-daemon "-Patomchat.publishArtifact=$WINDOWS_JAR"
          bash ./gradlew publishMods -Patomchat.nativePlatform=linux-x64 --no-daemon "-Patomchat.publishArtifact=$LINUX_JAR"
