name: Build

on:
  push:
    branches: ['**', '!dependabot/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Preserve every push; only superseded checks on the same PR are canceled.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  targets:
    name: 校验矩阵与分发脚本
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      list: ${{ steps.matrix.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 离线测试与矩阵校验
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -B tools/test_verify_jars.py
          python3 -B tools/test_ci_targets.py
          python3 -B tools/verify_targets.py --matrix-out "$RUNNER_TEMP/matrix.json"
      - name: 导出矩阵
        id: matrix
        run: echo "list=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-mod
        with:
          target: ${{ matrix.target }}
          project: ${{ matrix.project }}
          java: ${{ matrix.java }}
          artifact-name: atomchat-${{ matrix.target }}${{ matrix.suffix }}
          cache-read-only: ${{ github.repository != 'badnng/AtomChat-Mod-26.3' || github.event_name == 'pull_request' || (github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && github.ref != 'refs/heads/dev') }}

  telegram:
    name: 分发 CI JAR 到 Telegram
    needs: build
    if: >-
      vars.TELEGRAM_ENABLED == 'true' &&
      github.repository == 'badnng/AtomChat-Mod-26.3' &&
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: telegram-ci-channel
      cancel-in-progress: false
      queue: max
    env:
      TELEGRAM_BOT_API_COMMIT: e3e9dd8e5b3d7ab8537cd5a10dc31d5ffa8f82d1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 校验 Telegram 配置并选择 API
        id: telegram-config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python3 -B .github/scripts/telegram_ci.py validate-config
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: atomchat-*
          path: ${{ runner.temp }}/ci-artifacts
      - name: 恢复官方 Bot API 程序
        id: bot-api-cache
        if: steps.telegram-config.outputs.api_mode == 'local'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/telegram-bot-api-bin
          key: telegram-bot-api-ubuntu24.04-${{ runner.arch }}-${{ env.TELEGRAM_BOT_API_COMMIT }}-v1
      - name: 编译官方 Bot API 程序
        if: steps.telegram-config.outputs.api_mode == 'local' && steps.bot-api-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: bash .github/scripts/build_telegram_bot_api.sh
      - name: 缓存程序（不含机器人会话）
        if: steps.telegram-config.outputs.api_mode == 'local' && steps.bot-api-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/telegram-bot-api-bin
          key: ${{ steps.bot-api-cache.outputs.cache-primary-key }}
      - name: 发送同一份已验证 JAR 或超限下载链接
        timeout-minutes: 40
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_API_BINARY: ${{ runner.temp }}/telegram-bot-api-bin/telegram-bot-api
        run: python3 -B .github/scripts/telegram_ci.py send --artifacts-dir "$RUNNER_TEMP/ci-artifacts"
