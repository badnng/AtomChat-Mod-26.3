# Gradle writes worker @argfiles with its default charset; the Java launcher
# reads them with the native charset. COMPAT keeps non-ASCII workspace paths
# usable on Windows while following the native charset on other hosts too.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=COMPAT
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 仓库级身份（mod_version / mod_id / mod_name / mod_license / mod_group_id / mod_authors /
# mod_description）只在仓库根的 gradle.properties 里，由 gradle/atomchat-layers.gradle 读入。
# 这里只留本平台专有的键。

minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.99
neo_version_range=[26.3.0.99,26.4)

# Skija (HumbleUI Skia bindings, same line as Tuui)
skija_version=0.116.8

# Modern flat look and feel for the Swing image picker (Apache 2.0)
flatlaf_version=3.7.2
